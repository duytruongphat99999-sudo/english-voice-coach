server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Ban ghi presentation 3 phut co the vai MB.
  client_max_body_size 30m;

  # Neu vi ly do nao do nginx van phai redirect, bat no dung Location tuong
  # doi. Mac dinh no ghep server_name + port va lam mat ca hai khi dung sau
  # Cloudflare tunnel.
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # ==========================================================================
  # Cua vao
  #
  # Truoc day dung `auth_basic`. Bo vi tren may Duy, Chrome tu nhoi mot
  # username da luu tu trang khac ("75477011"), gui sai -> 401 -> gui lai ->
  # cham nguong -> ERR_TOO_MANY_RETRIES, khong sua duoc tu phia server.
  # Duong vong nhung credential vao URL cung chet: Chrome cam fetch() khi URL
  # cua trang co credential, nen app tai duoc vo ma moi loi goi API deu hong.
  #
  # Gio gac bang cookie phien: auth_request hoi evc-api moi request.
  # ==========================================================================
  auth_request /_authcheck;

  location = /_authcheck {
    internal;
    # Bat buoc, neu khong subrequest nay lai tu kich hoat auth_request -> de quy.
    auth_request off;

    proxy_pass http://evc-api:3040/auth/check;
    # Chi can header Cookie, khong can than request.
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
  }

  # --- Hai duong duy nhat mo truoc khi dang nhap ---------------------------

  # Trang dang nhap. Tu chua het CSS/JS nen KHONG can mo /_assets/.
  location = /login.html {
    auth_request off;
  }

  # Endpoint kiem mat khau.
  location = /api/auth/login {
    auth_request off;
    proxy_pass http://evc-api:3040/auth/login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Evc-Internal "yes";
  }

  # --- Phan con lai, deu sau cua -------------------------------------------

  location /_assets/ {
    auth_request off;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Public learning is static and has no access to personal APIs or history.
  location = / { auth_request off; try_files /index.html =404; add_header Cache-Control "no-cache"; }
  location = /index.html { auth_request off; add_header Cache-Control "no-cache"; }
  location = /sw.js { auth_request off; add_header Cache-Control "no-cache"; add_header Service-Worker-Allowed "/"; }
  location = /manifest.webmanifest { auth_request off; default_type application/manifest+json; }
  location ~ ^/(icon[^/]*\.(svg|png)|robots\.txt|sitemap\.xml)$ { auth_request off; }
  location /fonts/ { auth_request off; expires 30d; }
  location /audio/study/ { auth_request off; expires 7d; try_files $uri =404; }

  location /api/ {
    proxy_pass http://evc-api:3040/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Dau "request di qua chinh app nay".
    #
    # GET /today bi khoa bang TODAY_TOKEN de n8n goi duoc ma nguoi la thi
    # khong. Nhung chinh man Home cua app cung goi /today — va trong khong
    # co cho nao de nhet token vao trang tinh ma khong lo key ra HTML.
    #
    # proxy_set_header GHI DE gia tri client gui len, nen khach khong the tu
    # gan header nay: moi duong vao tu ben ngoai deu phai chui qua day.
    # n8n thi goi thang 127.0.0.1:3040, khong qua nginx, nen van phai co token.
    proxy_set_header X-Evc-Internal "yes";

    # SSE cua /api/chat: khong duoc dem, khong duoc dong som.
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection '';
    chunked_transfer_encoding off;

    # Chuoi STT -> Gemini -> TTS tren CPU co the toi ~90s.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # CO Y khong dat `error_page 401` o day: /api/ phai tra 401 tho de
    # JavaScript tu biet duong da het phien va chuyen sang /login.html.
    # Doi no thanh 302 se khien fetch() lang le nhan ve HTML trang dang nhap
    # roi bao "khong phai JSON" — sai cho, kho lan.
  }

  location / {
    # Chua dang nhap -> day ve trang dang nhap, giu lai cho dinh di.
    error_page 401 = @login;
    add_header Cache-Control "private, no-store";
    try_files $uri $uri.html =404;
  }

  location @login {
    return 302 /login.html?next=$request_uri;
  }
}
