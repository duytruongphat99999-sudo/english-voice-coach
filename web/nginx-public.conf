# Standalone free edition: static assets only. No AI, auth, or personal routes.
server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { default_type application/manifest+json; }
  location ~ ^/(icon[^/]*\.(svg|png)|robots\.txt|sitemap\.xml)$ { try_files $uri =404; }
  location /_assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location /fonts/ { expires 30d; }
  location /audio/study/ { expires 7d; try_files $uri =404; }
  location / { return 404; }
}
